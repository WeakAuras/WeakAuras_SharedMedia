name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
      - "!**-alpha**"
      - "!**-beta**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Hack around https://github.com/actions/checkout/issues/290
        run: |
          git fetch --tags --force


      - name: Create Package
        uses: BigWigsMods/packager@0f24d2169de3ceb3b79a981311b2ebab4c6160c7 # v2
        env:
          CF_API_KEY: ${{ secrets.CF_BUDS_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_BUDS_API_TOKEN }}
#          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
